name: Lint
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
