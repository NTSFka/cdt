name: Lint
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
